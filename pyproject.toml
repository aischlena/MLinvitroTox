[project]
name = "MLinvitroTox"
version = "2.0.0"
description = "MLinvitroTox performs high-throughput hazard-based prioritization of high-resolution mass spectrometry data."
authors = [
    { name = "Lena Aisch", email = "lena.aisch@eawag.ch" },
]
dependencies = [
    "numpy>=2.5.0",
    "pandas>=2.3.3",
    "scipy>=1.18.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.6.1,<1.7",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "plotly>=5.22.0",
    "tqdm>=4.66.4",
    "rdkit>=2023.9.6",
    "xgboost>=3.1.2",
    "imbalanced-learn>=0.14.0",
    "streamlit>=1.35.0",
    "cdk-pywrapper>=0.1.0",
    "openbabel-wheel>=3.1.1.19",
    "click>=8.1.7",
    "filetype>=1.2.0",
    "toml>=0.10.2",
]
readme = "README.md"
requires-python = ">= 3.8"

[project.scripts]
mlinvitrotox = "mlinvitrotox:main"
itox = "mlinvitrotox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pyinstrument>=4.6.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mlinvitrotox"]
